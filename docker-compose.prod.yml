name: intelligent-teaching-prod

services:
  postgres:
    image: postgres:16
    container_name: intelligent-teaching-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edugenie_prod}
      POSTGRES_USER: ${POSTGRES_USER:-edugenie_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-password}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - intelligent_teaching_postgres_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: intelligent-teaching-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - intelligent_teaching_redis_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: intelligent-teaching-backend:prod
    container_name: intelligent-teaching-backend-prod
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_NAME: ${APP_NAME:-棱镜智教-PrismMind}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DEBUG: ${APP_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      SECRET_KEY: ${SECRET_KEY:-change-me-production-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edugenie_user}:${POSTGRES_PASSWORD:-change-me-strong-password}@postgres:5432/${POSTGRES_DB:-edugenie_prod}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      USE_CELERY: ${USE_CELERY:-true}
      BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-["https://your-domain.com","http://your-domain.com"]}'
      STORAGE_ROOT: /app/storage
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      ALLOWED_UPLOAD_EXTENSIONS: ${ALLOWED_UPLOAD_EXTENSIONS:-.pdf,.docx,.txt,.md}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-chi_sim+eng}
      CHROMA_PERSIST_DIR: /app/storage/chroma
      CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION_NAME:-edugenie_knowledge}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-0}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AGENT_MODEL_ORCHESTRATOR: ${AGENT_MODEL_ORCHESTRATOR:-qwen3.7-plus}
      AGENT_MODEL_PROFILE: ${AGENT_MODEL_PROFILE:-qwen3.6-plus}
      AGENT_MODEL_TUTOR: ${AGENT_MODEL_TUTOR:-qwen3-max}
      AGENT_MODEL_RESOURCE: ${AGENT_MODEL_RESOURCE:-qwen3-max}
      AGENT_MODEL_TEST: ${AGENT_MODEL_TEST:-deepseek-v3}
      AGENT_MODEL_PATH: ${AGENT_MODEL_PATH:-qwen3.7-plus}
      AGENT_MODEL_ASSESSMENT: ${AGENT_MODEL_ASSESSMENT:-qwen3-max}
      AGENT_MODEL_VERIFIER: ${AGENT_MODEL_VERIFIER:-qwen3.6-plus}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      RERANK_MODEL: ${RERANK_MODEL:-gte-rerank-v2}
      LIVE_LLM_TESTS: ${LIVE_LLM_TESTS:-false}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-60}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-10}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-4}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-1000000}
      LLM_PER_RUN_TOKEN_BUDGET: ${LLM_PER_RUN_TOKEN_BUDGET:-32000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - intelligent_teaching_storage_prod:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
    image: intelligent-teaching-backend:prod
    container_name: intelligent-teaching-celery-worker-prod
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-棱镜智教-PrismMind}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DEBUG: ${APP_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      SECRET_KEY: ${SECRET_KEY:-change-me-production-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edugenie_user}:${POSTGRES_PASSWORD:-change-me-strong-password}@postgres:5432/${POSTGRES_DB:-edugenie_prod}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      USE_CELERY: ${USE_CELERY:-true}
      STORAGE_ROOT: /app/storage
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      ALLOWED_UPLOAD_EXTENSIONS: ${ALLOWED_UPLOAD_EXTENSIONS:-.pdf,.docx,.txt,.md}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-chi_sim+eng}
      CHROMA_PERSIST_DIR: /app/storage/chroma
      CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION_NAME:-edugenie_knowledge}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-0}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AGENT_MODEL_ORCHESTRATOR: ${AGENT_MODEL_ORCHESTRATOR:-qwen3.7-plus}
      AGENT_MODEL_PROFILE: ${AGENT_MODEL_PROFILE:-qwen3.6-plus}
      AGENT_MODEL_TUTOR: ${AGENT_MODEL_TUTOR:-qwen3-max}
      AGENT_MODEL_RESOURCE: ${AGENT_MODEL_RESOURCE:-qwen3-max}
      AGENT_MODEL_TEST: ${AGENT_MODEL_TEST:-deepseek-v3}
      AGENT_MODEL_PATH: ${AGENT_MODEL_PATH:-qwen3.7-plus}
      AGENT_MODEL_ASSESSMENT: ${AGENT_MODEL_ASSESSMENT:-qwen3-max}
      AGENT_MODEL_VERIFIER: ${AGENT_MODEL_VERIFIER:-qwen3.6-plus}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      RERANK_MODEL: ${RERANK_MODEL:-gte-rerank-v2}
      LIVE_LLM_TESTS: ${LIVE_LLM_TESTS:-false}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-60}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-10}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-4}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-1000000}
      LLM_PER_RUN_TOKEN_BUDGET: ${LLM_PER_RUN_TOKEN_BUDGET:-32000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=info"]
    volumes:
      - intelligent_teaching_storage_prod:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-/api/v1}
    image: intelligent-teaching-frontend:prod
    container_name: intelligent-teaching-frontend-prod
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: intelligent-teaching-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      # Enable after configuring certificates and TLS server blocks.
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

volumes:
  intelligent_teaching_postgres_prod:
    name: intelligent-teaching-prod-postgres-data
  intelligent_teaching_redis_prod:
    name: intelligent-teaching-prod-redis-data
  intelligent_teaching_storage_prod:
    name: intelligent-teaching-prod-storage-data
